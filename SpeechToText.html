<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เสียงเป็นข้อความ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f1; --surface:#ffffff; --text:#14181f; --muted:#5b6670; --line:#d3dcda;
  --accent:#0e8a7d; --accent-ink:#ffffff; --rec:#d93a3f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1415; --surface:#182022; --text:#eef3f2; --muted:#9aa8a6; --line:#2b3739;
    --accent:#33c2b2; --accent-ink:#06201d; --rec:#ff6b70; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1415; --surface:#182022; --text:#eef3f2; --muted:#9aa8a6; --line:#2b3739;
  --accent:#33c2b2; --accent-ink:#06201d; --rec:#ff6b70; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  line-height:1.6;
}
.wrap{max-width:760px; margin:0 auto; padding:20px 16px 40px}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px}
h1{font-size:1.4rem; margin:0; font-weight:700}
h2{font-size:1rem; margin:0 0 12px; font-weight:600}
button,select{font:inherit; color:inherit}
.btn{
  border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:8px 16px; cursor:pointer; min-height:40px;
}
.btn:hover{border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

.bar{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-bottom:12px}
.mic{
  display:inline-flex; align-items:center; gap:10px; border:0; cursor:pointer;
  background:var(--accent); color:var(--accent-ink); font-weight:700; font-size:1.05rem;
  padding:14px 26px; border-radius:999px; min-height:52px;
}
.mic svg{width:22px; height:22px; fill:currentColor}
.mic[aria-pressed="true"]{background:var(--rec); color:#fff; animation:pulse 1.6s ease-out infinite}
.mic:disabled{opacity:.45; cursor:not-allowed}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rec) 55%,transparent)}
  100%{box-shadow:0 0 0 16px transparent}
}
@media (prefers-reduced-motion: reduce){.mic[aria-pressed="true"]{animation:none}}
select{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; min-height:44px;
}
#status{color:var(--muted); font-size:.92rem; flex-basis:100%}
#status.err{color:var(--rec)}

#out{
  min-height:200px; padding:20px; background:var(--surface);
  white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.6;
  border-radius:14px; transition:border-width .15s;
}
#out.empty{opacity:.5}
.interim{opacity:.55}
.actions{display:flex; gap:8px; margin:12px 0 28px}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px}
.field label{display:block; font-size:.92rem; margin-bottom:6px}
.field .row{display:flex; align-items:center; gap:10px}
.field output{min-width:3.2em; color:var(--muted); font-size:.92rem}
input[type=range]{flex:1; accent-color:var(--accent); min-width:0}
input[type=color]{
  width:52px; height:40px; padding:2px; border:1px solid var(--line);
  border-radius:8px; background:var(--surface); cursor:pointer;
}
.foot{margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>เสียงเป็นข้อความ</h1>
    <button class="btn" id="themeBtn" type="button">โหมดกลางคืน</button>
  </header>

  <div class="bar">
    <button class="mic" id="mic" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a1 1 0 1 1 2 0 8 8 0 0 1-7 7.94V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.06A8 8 0 0 1 4 11a1 1 0 1 1 2 0 6 6 0 0 0 12 0Z"/></svg>
      <span id="micLabel">เริ่มฟัง</span>
    </button>
    <select id="lang" aria-label="ภาษาที่พูด">
      <option value="th-TH">ไทย</option>
      <option value="en-US">English</option>
      <option value="ja-JP">日本語</option>
      <option value="zh-CN">中文</option>
      <option value="ko-KR">한국어</option>
    </select>
    <div id="status" role="status">พร้อมใช้งาน</div>
  </div>

  <div id="out" class="empty" aria-live="polite"></div>
  <div class="actions">
    <button class="btn" id="copy" type="button">คัดลอกข้อความ</button>
    <button class="btn" id="clear" type="button">ล้างข้อความ</button>
  </div>

  <section class="panel" aria-labelledby="sTitle">
    <h2 id="sTitle">ตั้งค่าการแสดงผล</h2>
    <div class="grid">
      <div class="field">
        <label for="tc">สีข้อความ</label>
        <div class="row"><input type="color" id="tc"></div>
      </div>
      <div class="field">
        <label for="fs">ขนาดตัวอักษร</label>
        <div class="row"><input type="range" id="fs" min="14" max="72" step="1"><output id="fsV"></output></div>
      </div>
      <div class="field">
        <label for="bw">ความหนาขอบ</label>
        <div class="row"><input type="range" id="bw" min="0" max="12" step="1"><output id="bwV"></output></div>
      </div>
      <div class="field">
        <label for="bc">สีขอบ</label>
        <div class="row"><input type="color" id="bc"></div>
      </div>
    </div>
    <div class="foot"><button class="btn" id="reset" type="button">คืนค่าเริ่มต้น</button></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const root = document.documentElement;
const out = $('out');
const KEY = 'stt-settings';
const DEF = { theme:'', textColor:'', size:28, bw:3, bc:'', lang:'th-TH' };
let S = { ...DEF };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const isDark = () => S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

function applyStyle(){
  if (S.theme) root.setAttribute('data-theme', S.theme); else root.removeAttribute('data-theme');
  const dark = isDark();
  out.style.color = S.textColor || '';
  out.style.fontSize = S.size + 'px';
  out.style.border = S.bw + 'px solid ' + (S.bc || 'var(--accent)');
  $('tc').value = S.textColor || (dark ? '#eef3f2' : '#14181f');
  $('bc').value = S.bc || (dark ? '#33c2b2' : '#0e8a7d');
  $('fs').value = S.size; $('fsV').textContent = S.size + ' px';
  $('bw').value = S.bw;   $('bwV').textContent = S.bw + ' px';
  $('themeBtn').textContent = dark ? 'โหมดสว่าง' : 'โหมดกลางคืน';
  $('lang').value = S.lang;
}

/* ---------- ข้อความ ---------- */
let finalText = '', interim = '', listening = false, errMsg = '', rec = null;

function render(){
  out.textContent = '';
  if (!finalText && !interim){
    out.classList.add('empty');
    out.textContent = 'กดปุ่มไมค์แล้วเริ่มพูด ข้อความจะแสดงตรงนี้';
    return;
  }
  out.classList.remove('empty');
  out.append(document.createTextNode(finalText));
  if (interim){
    const s = document.createElement('span');
    s.className = 'interim';
    s.textContent = (finalText ? ' ' : '') + interim;
    out.append(s);
  }
}

function ui(){
  const m = $('mic');
  m.setAttribute('aria-pressed', listening);
  $('micLabel').textContent = listening ? 'หยุดฟัง' : 'เริ่มฟัง';
  $('lang').disabled = listening;
  const st = $('status');
  st.className = errMsg ? 'err' : '';
  st.textContent = errMsg || (listening ? 'กำลังฟัง… พูดได้เลย' : 'พร้อมใช้งาน');
}

/* ---------- รู้จำเสียง ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR){
  $('mic').disabled = true;
  errMsg = 'เบราว์เซอร์นี้ไม่รองรับการรู้จำเสียง ลองใช้ Chrome หรือ Safari';
}

function start(){
  errMsg = '';
  if (rec){ rec.onresult = rec.onerror = rec.onend = null; try { rec.abort(); } catch (e) {} }
  rec = new SR();
  rec.lang = S.lang;
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = e => {
    interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += (finalText ? ' ' : '') + t.trim();
      else interim += t;
    }
    render();
  };
  rec.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    listening = false;
    errMsg = (e.error === 'not-allowed' || e.error === 'service-not-allowed')
      ? 'ไม่ได้รับอนุญาตให้ใช้ไมโครโฟน กรุณาอนุญาตในเบราว์เซอร์แล้วลองใหม่'
      : 'เกิดข้อผิดพลาด: ' + e.error;
    ui();
  };
  rec.onend = () => {
    if (listening){
      try { rec.start(); return; } catch (e) { listening = false; }
    }
    rec.ended = true;
    finish();
  };
  try { rec.start(); listening = true; }
  catch (e) { listening = false; errMsg = 'เริ่มฟังไม่ได้ ลองกดอีกครั้ง'; }
  ui();
}

function finish(){
  listening = false;
  if (interim){ finalText += (finalText ? ' ' : '') + interim.trim(); interim = ''; }
  render(); ui();
}

function stop(){
  listening = false;
  ui();
  const cur = rec;
  if (!cur) return finish();
  try { cur.stop(); } catch (e) {}
  /* ถ้าเบราว์เซอร์ไม่ตอบสนองต่อ stop ให้บังคับหยุด */
  setTimeout(() => {
    if (rec !== cur || cur.ended) return;
    cur.onresult = cur.onerror = cur.onend = null;
    try { cur.abort(); } catch (e) {}
    cur.ended = true;
    finish();
  }, 700);
}

$('mic').onclick = () => listening ? stop() : start();
$('lang').onchange = e => { S.lang = e.target.value; save(); };

$('clear').onclick = () => { finalText = ''; interim = ''; render(); };
$('copy').onclick = async () => {
  const t = (finalText + (interim ? ' ' + interim : '')).trim();
  if (!t) return;
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = t; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); } catch (_) {}
    ta.remove();
  }
  const b = $('copy'); b.textContent = 'คัดลอกแล้ว';
  setTimeout(() => { b.textContent = 'คัดลอกข้อความ'; }, 1400);
};

/* ---------- ตั้งค่า ---------- */
$('themeBtn').onclick = () => { S.theme = isDark() ? 'light' : 'dark'; save(); applyStyle(); };
$('tc').oninput = e => { S.textColor = e.target.value; save(); applyStyle(); };
$('bc').oninput = e => { S.bc = e.target.value; save(); applyStyle(); };
$('fs').oninput = e => { S.size = +e.target.value; save(); applyStyle(); };
$('bw').oninput = e => { S.bw = +e.target.value; save(); applyStyle(); };
$('reset').onclick = () => {
  S.textColor = ''; S.bc = ''; S.size = DEF.size; S.bw = DEF.bw;
  save(); applyStyle();
};

applyStyle(); render(); ui();
</script>
</body>
        </html>
